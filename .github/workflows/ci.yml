name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sagasmith-narrative
      - uses: actions/checkout@v7
        with:
          repository: SagaSmithAI/sagasmith-core
          path: sagasmith-core
      - uses: actions/checkout@v7
        with:
          repository: SagaSmithAI/SagaSmith-agent
          path: SagaSmith-agent
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - name: Install locked Narrative workspace
        working-directory: sagasmith-narrative
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint and test Domain plus public MCP behavior
        working-directory: sagasmith-narrative
        run: |
          uv run --no-sync ruff check packages/domain packages/mcp
          uv run --no-sync pytest packages/domain/tests
          uv run --no-sync pytest packages/mcp/tests --ignore=packages/mcp/tests/test_agent_host_integration.py
      - name: Install Agent host environment
        working-directory: SagaSmith-agent
        run: uv sync --extra dev
      - name: Verify real Agent dynamic-tool refresh
        working-directory: sagasmith-narrative
        run: >-
          ../SagaSmith-agent/.venv/bin/python -m pytest -q
          packages/mcp/tests/test_agent_host_integration.py
      - name: Run all campaign fixtures through real stdio sessions
        working-directory: sagasmith-narrative
        run: >-
          uv run --no-sync python packages/mcp/scripts/regression_parallel_campaigns.py
          --output .runs/ci

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate every Narrative Skill bundle
        shell: python
        run: |
          from pathlib import Path

          roots = sorted(path.parent for path in Path("skills").glob("*/SKILL.md"))
          if not roots:
              raise SystemExit("no Skill bundles found")
          for root in roots:
              text = (root / "SKILL.md").read_text(encoding="utf-8-sig")
              if not text.startswith("---\n") or text.count("---") < 2:
                  raise SystemExit(f"{root}: SKILL.md has no frontmatter")
              frontmatter = text.split("---", 2)[1]
              fields = [
                  line.split(":", 1)[0].strip()
                  for line in frontmatter.splitlines()
                  if line.strip()
              ]
              if fields != ["name", "description"]:
                  raise SystemExit(
                      f"{root}: frontmatter must contain only name and description"
                  )
              if not (root / "references" / "workflow.md").is_file():
                  raise SystemExit(f"{root}: references/workflow.md is required")
              if not (root / "agents" / "openai.yaml").is_file():
                  raise SystemExit(f"{root}: agents/openai.yaml is required")
          print(f"validated {len(roots)} Skill bundles")
