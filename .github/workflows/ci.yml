name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sagasmith-narrative
      - uses: actions/checkout@v4
        with:
          repository: SagaSmithAI/sagasmith-core
          path: sagasmith-core
      - uses: actions/checkout@v4
        with:
          repository: SagaSmithAI/SagaSmith-agent
          path: SagaSmith-agent
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked Narrative workspace
        working-directory: sagasmith-narrative
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint and test Domain plus public MCP behavior
        working-directory: sagasmith-narrative
        run: |
          uv run --no-sync ruff check packages/domain packages/mcp
          uv run --no-sync pytest packages/domain/tests
          uv run --no-sync pytest packages/mcp/tests --ignore=packages/mcp/tests/test_agent_host_integration.py
      - name: Install locked Agent host environment
        working-directory: SagaSmith-agent
        run: uv sync --frozen
      - name: Verify real Agent dynamic-tool refresh
        working-directory: sagasmith-narrative
        run: >-
          ../SagaSmith-agent/.venv/bin/python -m pytest -q
          packages/mcp/tests/test_agent_host_integration.py
      - name: Run all campaign fixtures through real stdio sessions
        working-directory: sagasmith-narrative
        run: >-
          uv run --no-sync python packages/mcp/scripts/regression_parallel_campaigns.py
          --output .runs/ci
