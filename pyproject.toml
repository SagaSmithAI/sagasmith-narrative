[project]
name = "sagasmith-narrative-workspace"
version = "0.1.0"
description = "Development workspace for the SagaSmith Narrative domain, MCP, and Skills"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/domain", "packages/mcp"]

[tool.pytest.ini_options]
testpaths = ["packages/domain/tests", "packages/mcp/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
